# Seed Job — ensures the bootstrap admin allowlist (ADMIN_BOOTSTRAP_EMAILS),
# the seat matrix (sector × region cells from defs.md), and the active
# Candidate Agreement version. CI runs this automatically on every deploy
# (after migrations). Idempotent (upsert): it never removes admins added later
# in /admin/admins, never deletes seat cells, and never re-pins a changed
# agreement file.
#
# Can also be run manually:
#   kubectl -n web delete job council-seed --ignore-not-found
#   kubectl -n web apply -f ci/seed-job.yaml
#   kubectl -n web wait --for=condition=complete job/council-seed --timeout=120s
#   kubectl -n web logs job/council-seed
apiVersion: batch/v1
kind: Job
metadata:
  name: council-seed
  namespace: web
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: veranalabs/veranacouncil.org-website:migrate
          imagePullPolicy: Always
          command: ["node", "prisma/seed.mjs"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: veranacouncil-website-secrets
                  key: DATABASE_URL
            # Comma-separated admin emails — from the cluster Secret.
            - name: ADMIN_BOOTSTRAP_EMAILS
              valueFrom:
                secretKeyRef:
                  name: veranacouncil-website-secrets
                  key: ADMIN_BOOTSTRAP_EMAILS
                  optional: true
            # Optional: which legal/ version file to activate as the Candidate
            # Agreement (defaults to candidate-agreement-v1.md).
            # - name: AGREEMENT_FILENAME
            #   value: "candidate-agreement-v1.md"
